services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chi311
      POSTGRES_PASSWORD: chi311
      POSTGRES_DB: chi311
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
