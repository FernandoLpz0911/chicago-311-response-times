services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chi311
      POSTGRES_PASSWORD: chi311
      POSTGRES_DB: chi311
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chi311"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
